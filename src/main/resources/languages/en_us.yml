general:
  time:
    year: 'year'
    years: 'years'
    month: 'month'
    months: 'months'
    day: 'day'
    days: 'days'
    hour: 'hour'
    hours: 'hours'
    minute: 'minute'
    minutes: 'minutes'
    second: 'second'
    seconds: 'seconds'
action-bar:
  message: "&eFlight Mode: %flightmode% &8| &6Remaining Flight Time: &e%duration%"
  infinite: "&b&lInfinite"
  flight-mode:
    enabled: "&a&lEnabled"
    disabled: "&c&lDisabled"

placeholder:
  timedwings_total_flight_time:
    time: '{y} {mo} {d} {h} {m} {s}'
    no-time: '&cNo Time Left'
  timedwings_total_flight_time_seconds:
    time: '{time}'
    no-time: '&cNo Time Left'

Commands:
  Console-Only: "&8[&bTimedWings&8] &cThis command is not available for the console."

  Default:
    Usage: "/tw default <player>"
    No-Time: "&8[&bTimedWings&8] &7Flight: Time &cNo Time Left"
    Time-Left: "&8[&bTimedWings&8] &7Flight Time: &e%time-left%"
    Format: "{h} {m} {s}"

  Help:
    Message:
      - "&3TimedWings Command List;"
      - "&6/tw &7- Show your flight time"
      - "&6/tw help &7- Show this help"
      - "&6/tw check <player> &7- Check a player's flight time"
      - "&6/tw give <player> <seconds> &7- Give flight time"
      - "&6/tw set <player> <seconds> &7- Set flight time"
      - "&6/tw clear <player> &7- Clear flight time"
      - "&6/tw toggle [player] &7- Toggle flight mode"
      - "&6/tw reload &7- Reload configuration"
      - "&6/tw version &7- Show plugin version"

  Version:
    Message: "&8[&bTimedWings&8] &7Running version &e%version%"

  Toggle:
    Usage: "&cUsage: /tw toggle [player]"
    Player-Not-Found: "&8[&bTimedWings&8] &cPlayer not found."
    No-Time: "&8[&bTimedWings&8] &cNo flight time remaining."
    Enabled: "&8[&bTimedWings&8] &aFlight enabled for &e%player%&a."
    Disabled: "&8[&bTimedWings&8] &cFlight disabled for &e%player%&c."

  Give:
    Usage: "&cUsage: /tw give <player> <seconds>"
    Player-Not-Found: "&8[&bTimedWings&8] &cPlayer not found."
    Invalid-Amount: "&8[&bTimedWings&8] &cInvalid amount of seconds."
    Success: "&8[&bTimedWings&8] &aGave &e%seconds%s &aflight time to &e%player%&a."

  Set:
    Usage: "&cUsage: /tw set <player> <seconds>"
    Player-Not-Found: "&8[&bTimedWings&8] &cPlayer not found."
    Invalid-Amount: "&8[&bTimedWings&8] &cInvalid amount of seconds."
    Success: "&8[&bTimedWings&8] &aSet flight time of &e%player% &ato &e%seconds%s&a."

  Check:
    Usage: "&8[&bTimedWings&8] &cUsage: /tw check <player>"
    Player-Not-Found: "&8[&bTimedWings&8] &cPlayer not found."
    Format: "{h} {m} {s}"
    Result: "&8[&bTimedWings&8] &7%player%'s flight time: &e%time%"

  Clear:
    Usage: "&cUsage: /tw clear <player>"
    Player-Not-Found: "&8[&bTimedWings&8] &7Player not found."
    Success: "&8[&bTimedWings&8] &7Cleared all flight time for &e%player%&c."

  Reload:
    Success: "&8[&bTimedWings&8] &aConfiguration reloaded successfully."

  Migrate:
    Usage: "&cUsage: /tw migrate &7| &cAvailable Migrations: &e%migrations%"
    No-Migrations-Available: "&8[&bTimedWings&8] &7No migrations available."
    Console-Only: "&8[&bTimedWings&8] &cThis command can only be used by the console."
    Success: "&8[&bTimedWings&8] &a%plugin% migration completed."
    Failure: "&8[&bTimedWings&8] &c%plugin% migration failed!"



Adapters:
  FabledSkyBlock:
    Flight-Disabled: "&8[&bTimedWings&8] &cYou don't have permission to fly in this island."
  WorldGuard:
    Flight-Disabled: "&8[&bTimedWings&8] &cYou don't have permission to fly in this region."